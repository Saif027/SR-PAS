    <meta charset="UTF-8">

        content="width=device-width, initial-scale=1.0"
    >

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >


    <!-- Custom CSS -->

    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>


<body>

        <a

            href="dashboard.html"
        >

            <span>📊</span>

            Student Analytics

        </a>

            class="navbar-toggler"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#navbarNav"

            <span class="navbar-toggler-icon"></span>

        </button>


        <div

            id="navbarNav"

            <ul class="navbar-nav ms-auto">

                </li>

<!-- =========================================
     MAIN CONTENT
========================================= -->

<div class="container dashboard-container">


    <div class="mb-4">

        <h2 class="fw-bold">
            Result Management
        </h2>

        <p class="text-muted">
            Add and manage results for each semester.
        </p>

    </div>



    <!-- =====================================
         SEMESTER SELECTOR
    ====================================== -->

    <div class="card shadow-sm p-4 mb-4">

        <div class="row align-items-end">

            <div class="col-md-6">

                <label class="form-label fw-bold">
                    Select Semester
                </label>

                <select
                    id="semesterSelect"
                    class="form-select"
                >

                    <option value="1">
                        Semester 1
                    </option>

                    <option value="2">
                        Semester 2
                    </option>

                    <option value="3">
                        Semester 3
                    </option>

                    <option value="4">
                        Semester 4
                    </option>

                    <option value="5">
                        Semester 5
                    </option>

                    <option value="6">
                        Semester 6
                    </option>

                    <option value="7">
                        Semester 7
                    </option>

                    <option value="8">
                        Semester 8
                    </option>

                </select>

            </div>


            <div class="col-md-6 mt-3 mt-md-0">

                <div class="alert alert-info mb-0">

                    GPA for selected semester:

                    <strong id="semesterGPA">
                        0.00
                    </strong>

                </div>

            </div>

        </div>

    </div>



    <!-- =====================================
         ADD SUBJECT
    ====================================== -->

    <div class="card shadow-sm p-4 mb-4">

        <h5 class="fw-bold mb-3">
            Add Subject
        </h5>


        <div class="row g-3">


            <div class="col-md-5">

                <label class="form-label">
                    Subject Name
                </label>

                <input
                    type="text"
                    id="subjectName"
                    class="form-control"
                    placeholder="Example: Data Structures"
                >

            </div>


            <div class="col-md-3">

                <label class="form-label">
                    Marks
                </label>

                <input
                    type="number"
                    id="marks"
                    class="form-control"
                    placeholder="0 - 100"
                    min="0"
                    max="100"
                >

            </div>


            <div class="col-md-2">

                <label class="form-label">
                    Credits
                </label>

                <input
                    type="number"
                    id="credits"
                    class="form-control"
                    placeholder="Credits"
                    min="1"
                    max="10"
                >

            </div>


            <div class="col-md-2 d-flex align-items-end">

                <button
                    class="btn btn-primary w-100"
                    onclick="addSubject()"
                >
                    Add Subject
                </button>

            </div>

        </div>

    </div>



    <!-- =====================================
         RESULT TABLE
    ====================================== -->

    <div class="card shadow-sm p-4">

        <div class="d-flex justify-content-between mb-3">

            <h5 class="fw-bold">
                Semester Results
            </h5>

            <span
                class="badge bg-primary"
                id="subjectCount"
            >
                0 Subjects
            </span>

        </div>


        <div class="table-responsive">

            <table
                class="table table-bordered table-hover result-table"
            >

                <thead class="table-dark">

                    <tr>

                        <th>#</th>

                        <th>Subject</th>

                        <th>Marks</th>

                        <th>Credits</th>

                        <th>Grade</th>

                        <th>Grade Point</th>

                        <th>Action</th>

                    </tr>

                </thead>


                <tbody id="resultTable">

                </tbody>

            </table>

        </div>


        <!-- Summary -->

        <div class="row mt-4">


            <div class="col-md-4">

                <div class="alert alert-primary">

                    <strong>
                        GPA:
                    </strong>

                    <span id="gpa">
                        0.00
                    </span>

                </div>

            </div>


            <div class="col-md-4">

                <div class="alert alert-success">

                    <strong>
                        Total Credits:
                    </strong>

                    <span id="totalCredits">
                        0
                    </span>

                </div>

            </div>


            <div class="col-md-4">

                <div class="alert alert-info">

                    <strong>
                        Average Marks:
                    </strong>

                    <span id="averageMarks">
                        0.00
                    </span>

                </div>

            </div>


        </div>

    </div>

</div>



<!-- Bootstrap JS -->

<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
></script>

<script src="js/result.js"></script>


</body>

</html>
