<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Student Result & Performance Analytics</title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- Custom CSS -->
    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>


<body class="login-page">


<div class="container">

    <div class="row justify-content-center align-items-center min-vh-100">

        <div class="col-md-7 col-lg-6">

            <div class="card shadow-lg border-0">

                <div class="card-body p-5">


                    <!-- Header -->

                    <div class="text-center mb-4">

                        <div class="logo-circle">
                            📊
                        </div>

                        <h2 class="fw-bold mt-3">
                            Student Result & Performance Analytics
                        </h2>

                        <p class="text-muted">
                            Manage and analyze academic performance
                        </p>

                    </div>


                    <!-- Student Form -->

                    <form id="studentForm">


                        <!-- Name -->

                        <div class="mb-3">

                            <label class="form-label">
                                Student Name
                            </label>

                            <input
                                type="text"
                                id="studentName"
                                class="form-control"
                                placeholder="Enter student name"
                                required
                            >

                        </div>


                        <!-- ID -->

                        <div class="mb-3">

                            <label class="form-label">
                                Student ID
                            </label>

                            <input
                                type="text"
                                id="studentId"
                                class="form-control"
                                placeholder="Enter student ID"
                                required
                            >

                        </div>


                        <!-- Department -->

                        <div class="mb-3">

                            <label class="form-label">
                                Department
                            </label>

                            <input
                                type="text"
                                id="department"
                                class="form-control"
                                placeholder="Example: Computer Science"
                                required
                            >

                        </div>


                        <!-- Starting Semester -->

                        <div class="mb-4">

                            <label class="form-label">
                                Starting Semester
                            </label>

                            <select
                                id="semester"
                                class="form-select"
                                required
                            >

                                <option value="">
                                    Select Semester
                                </option>

                                <option value="1">
                                    Semester 1
                                </option>

                                <option value="2">
                                    Semester 2
                                </option>

                                <option value="3">
                                    Semester 3
                                </option>

                                <option value="4">
                                    Semester 4
                                </option>

                                <option value="5">
                                    Semester 5
                                </option>

                                <option value="6">
                                    Semester 6
                                </option>

                                <option value="7">
                                    Semester 7
                                </option>

                                <option value="8">
                                    Semester 8
                                </option>

                            </select>

                        </div>


                        <button
                            type="submit"
                            class="btn btn-primary w-100 py-2"
                        >
                            Start Academic Dashboard
                        </button>


                    </form>

                </div>

            </div>

        </div>

    </div>

</div>


<script>

document
    .getElementById("studentForm")
    .addEventListener("submit", function(event) {

        event.preventDefault();


        const name =
            document
                .getElementById("studentName")
                .value
                .trim();


        const id =
            document
                .getElementById("studentId")
                .value
                .trim();


        const department =
            document
                .getElementById("department")
                .value
                .trim();


        const semester =
            Number(
                document
                    .getElementById("semester")
                    .value
            );


        if (!name || !id || !department || !semester) {

            alert("Please fill in all fields.");

            return;

        }


        /*
         * Create a completely new student record.
         */

        const studentData = {

            name: name,

            id: id,

            department: department,

            semesters: []

        };


        /*
         * Create semesters 1 to 8.
         */

        for (let i = 1; i <= 8; i++) {

            studentData.semesters.push({

                semester: i,

                subjects: []

            });

        }


        /*
         * Save student information.
         */

        localStorage.setItem(
            "studentData",
            JSON.stringify(studentData)
        );


        localStorage.setItem(
            "studentName",
            name
        );


        localStorage.setItem(
            "studentId",
            id
        );


        localStorage.setItem(
            "department",
            department
        );


        localStorage.setItem(
            "currentSemester",
            semester
        );


        window.location.href =
            "dashboard.html";

    });

</script>


</body>

</html>
